<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Select Element</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar__row">
          <h1 class="brand">Select Element</h1>
          <button
            id="settingsButton"
            class="icon-button"
            type="button"
            popovertarget="settingsPopover"
            title="设置"
            aria-label="设置"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>
        </div>

        <button id="toggleButton" class="button button--primary button--block" type="button">
          开始选择
        </button>

        <div class="search-row">
          <input
            id="searchInput"
            class="input"
            type="search"
            placeholder="搜索元素、文本、页面或需求"
          />
          <button
            id="menuButton"
            class="icon-button"
            type="button"
            popovertarget="moreMenu"
            title="更多操作"
            aria-label="更多操作"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="5" cy="12" r="1.5" />
              <circle cx="12" cy="12" r="1.5" />
              <circle cx="19" cy="12" r="1.5" />
            </svg>
          </button>
        </div>
      </header>

      <div class="list-header">
        <span id="recordCount">0 条记录</span>
      </div>
      <main id="listContainer" class="record-list" aria-live="polite"></main>

      <section id="composer" class="composer" hidden>
        <div class="composer__target">
          <span id="composerKind" class="chip"></span>
          <code id="composerSelector" class="mono"></code>
        </div>
        <textarea
          id="noteInput"
          class="input composer__input"
          rows="3"
          placeholder="写下想怎么改，例如：宽度改成 200px，和右边的按钮对齐（自动保存）"
        ></textarea>
        <button id="copyButton" class="button button--primary button--block" type="button">
          复制给 AI
        </button>
        <details class="prompt-preview">
          <summary>预览将复制的内容</summary>
          <pre id="promptViewer" class="prompt-preview__body"></pre>
        </details>
      </section>
    </div>

    <div id="settingsPopover" class="popover" popover>
      <div class="popover__section">
        <div class="popover__label">悬浮球</div>
        <div class="seg-control" id="fabModeControl">
          <button class="seg-btn is-active" type="button" data-fab-mode="off">关闭</button>
          <button class="seg-btn" type="button" data-fab-mode="current-tab">仅当前页</button>
          <button class="seg-btn" type="button" data-fab-mode="all-tabs">所有网页</button>
        </div>
      </div>
      <div class="popover__section">
        <div class="popover__label">快捷键</div>
        <ul id="shortcutList" class="shortcut-list"></ul>
        <button id="editShortcutsButton" class="link-button" type="button">修改快捷键</button>
      </div>
    </div>

    <div id="moreMenu" class="popover menu" popover>
      <button id="exportButton" class="menu__item" type="button">导出 JSON</button>
      <button id="clearButton" class="menu__item menu__item--danger" type="button">
        清空全部记录
      </button>
    </div>

    <div id="toast" class="toast" hidden>
      <span id="toastText"></span>
      <button id="toastAction" class="toast__action" type="button" hidden>撤销</button>
    </div>

    <script src="utils.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
